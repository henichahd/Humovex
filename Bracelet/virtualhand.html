<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modèle 3D Poignet - Angles & Vibrations</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; color: white; font-family: sans-serif; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; border: 1px solid #444; width: 320px; }
        button { width: 100%; padding: 10px; font-size: 16px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #45a049; }
        h3 { margin: 12px 0 5px 0; }
        p { margin: 5px 0; font-size: 13px; color: #ccc; }
        
        /* Jauge de vibration */
        .vib-container { width: 100%; background-color: #444; border-radius: 4px; height: 14px; margin-top: 8px; overflow: hidden; }
        #vibBar { height: 100%; width: 0%; background-color: #4CAF50; transition: width 0.1s, background-color 0.2s; }
        #vibStatus { font-weight: bold; color: #aaa; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui">
    <button id="connectBtn">Connecter Bracelet (ESP32)</button>
    <h3 id="rebaScore">Score REBA Poignet : --</h3>
    <p id="angles">Flexion : 0° | Déviation : 0° | Pronation : 0°</p>
    
    <hr style="border-color: #444; margin: 10px 0;">
    <p>Vibrations outil : <span id="vibValue">0.0</span> m/s² (<span id="vibStatus">Au repos</span>)</p>
    <div class="vib-container">
        <div id="vibBar"></div>
    </div>
</div>

<script>
    // --- 1. CONFIGURATION DE LA SCÈNE 3D ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 6);
    camera.lookAt(0, 0, -1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true; 
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const topLight = new THREE.DirectionalLight(0xffffff, 0.7);
    topLight.position.set(2, 10, 2);
    scene.add(topLight);
    const bottomLight = new THREE.DirectionalLight(0xffffff, 0.3);
    bottomLight.position.set(-2, -5, -5);
    scene.add(bottomLight);

    const skinMat = new THREE.MeshStandardMaterial({ color: 0xe0ac69, roughness: 0.6 }); 
    const sleeveMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.8 }); 
    const toolMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.5, roughness: 0.5 }); 

    // --- 2. CONSTRUCTION DU SQUELETTE ---
    const armGroup = new THREE.Group();
    scene.add(armGroup);
    armGroup.rotation.x = Math.PI / 2; 
    armGroup.rotation.y = Math.PI; 

    const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.4, 4, 32), sleeveMat);
    forearm.position.y = -2; 
    armGroup.add(forearm);

    const wristPivot = new THREE.Group();
    armGroup.add(wristPivot);

    const palm = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 0.4), skinMat);
    palm.position.y = 0.7; 
    wristPivot.add(palm);

    const tool = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 3, 16), toolMat);
    tool.position.set(0, 0.8, 0.4); 
    tool.rotation.z = THREE.MathUtils.degToRad(90); 
    wristPivot.add(tool);

    function createCurledFinger(xOffset, lengthScale) {
        const fingerGroup = new THREE.Group();
        fingerGroup.position.set(xOffset, 0.7, 0); 
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.6 * lengthScale), skinMat);
        base.position.set(0, 0, 0.3 * lengthScale);
        base.rotation.x = THREE.MathUtils.degToRad(90);
        fingerGroup.add(base);
        const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.5 * lengthScale), skinMat);
        tip.position.set(0, -0.25 * lengthScale, 0.55 * lengthScale);
        tip.rotation.x = THREE.MathUtils.degToRad(170); 
        fingerGroup.add(tip);
        return fingerGroup;
    }

    palm.add(createCurledFinger(-0.45, 0.8)); 
    palm.add(createCurledFinger(-0.15, 1.0)); 
    palm.add(createCurledFinger(0.15, 1.1));  
    palm.add(createCurledFinger(0.45, 1.0));  

    const thumbPivot = new THREE.Group();
    thumbPivot.position.set(0.75, -0.2, 0.2); 
    thumbPivot.rotation.z = THREE.MathUtils.degToRad(-45); 
    thumbPivot.rotation.x = THREE.MathUtils.degToRad(20);  
    const thumbBase = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.7), skinMat);
    thumbBase.position.y = 0.35;
    thumbPivot.add(thumbBase);
    const thumbTip = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.5), skinMat);
    thumbTip.position.set(0, 0.85, 0.1); 
    thumbTip.rotation.x = THREE.MathUtils.degToRad(-20); 
    thumbPivot.add(thumbTip);
    palm.add(thumbPivot); 

    let currentVibration = 0; // Variable globale pour faire trembler l'outil

    // --- 3. LOGIQUE REBA & VIBRATIONS ---
    function updateMetrics(pitch, roll, yaw, vib) {
        document.getElementById('angles').innerText = 
            `Flexion : ${pitch.toFixed(1)}° | Déviation : ${yaw.toFixed(1)}° | Pronation : ${roll.toFixed(1)}°`;
        
        // Score REBA
        let score = 1; 
        if (Math.abs(pitch) > 15) score = 2; 
        if (Math.abs(yaw) > 10) score += 1; 
        // Si forte vibration (> 5 m/s²) pendant une mauvaise posture, le risque augmente
        if (vib > 5.0 && score >= 2) score += 1;
        
        const scoreEl = document.getElementById('rebaScore');
        scoreEl.innerText = `Score REBA Poignet : ${score}`;
        if (score === 1) scoreEl.style.color = "#4CAF50"; 
        else if (score === 2) scoreEl.style.color = "#FFEB3B"; 
        else scoreEl.style.color = "#F44336"; 

        // Mise à jour de la jauge de vibration
        currentVibration = vib;
        document.getElementById('vibValue').innerText = vib.toFixed(1);
        
        // Pourcentage de la barre (plafonné à 15 m/s² = 100%)
        let pct = Math.min((vib / 15.0) * 100, 100);
        const vibBar = document.getElementById('vibBar');
        const vibStatus = document.getElementById('vibStatus');
        vibBar.style.width = pct + "%";

        if (vib < 0.5) {
            vibBar.style.backgroundColor = "#4CAF50";
            vibStatus.innerText = "Outil à l'arrêt";
            vibStatus.style.color = "#aaa";
            toolMat.color.setHex(0x555555); // Outil gris
        } else if (vib < 5.0) {
            vibBar.style.backgroundColor = "#FFEB3B";
            vibStatus.innerText = "Travail en cours (Normal)";
            vibStatus.style.color = "#FFEB3B";
            toolMat.color.setHex(0x888855); // Outil légèrement teinté
        } else {
            vibBar.style.backgroundColor = "#F44336";
            vibStatus.innerText = "⚠️ Vibration excessive !";
            vibStatus.style.color = "#F44336";
            toolMat.color.setHex(0xcc3333); // Outil devient rouge d'alerte
        }
    }

    // --- 4. LECTURE USB ---
    let port;
    document.getElementById('connectBtn').addEventListener('click', async () => {
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });
            const textDecoder = new TextDecoderStream();
            port.readable.pipeTo(textDecoder.writable);
            const reader = textDecoder.readable.getReader();

            let buffer = "";
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += value;
                let lines = buffer.split('\n');
                buffer = lines.pop(); 

                for (let line of lines) {
                    line = line.trim();
                    if (line.startsWith("{") && line.endsWith("}")) {
                        try {
                            let data = JSON.parse(line);
                            wristPivot.rotation.x = THREE.MathUtils.degToRad(data.pitch);
                            wristPivot.rotation.y = THREE.MathUtils.degToRad(data.roll);
                            wristPivot.rotation.z = THREE.MathUtils.degToRad(data.yaw); 
                            
                            updateMetrics(data.pitch, data.roll, data.yaw, data.vib || 0);
                        } catch (e) {}
                    }
                }
            }
        } catch (error) {
            console.error(error);
            alert("Erreur de connexion. Vérifiez le branchement et fermez le moniteur série Arduino.");
        }
    });

    // --- 5. ANIMATION ---
    function animate() {
        requestAnimationFrame(animate);

        // Effet visuel : l'outil tremble physiquement selon l'intensité de la vibration
        if (currentVibration > 0.5) {
            let shake = Math.min(currentVibration * 0.005, 0.08);
            tool.position.x = (Math.random() - 0.5) * shake;
            tool.position.y = 0.8 + (Math.random() - 0.5) * shake;
        } else {
            tool.position.x = 0;
            tool.position.y = 0.8;
        }

        renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
    });
</script>
</body>
</html>
